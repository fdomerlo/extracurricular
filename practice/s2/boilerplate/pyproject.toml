[project]
name = "consultorio-s2"
version = "0.2.0"
description = "Extracurricular S2 — Consultorio Médico persistente con PostgreSQL y Django ORM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<5.2",
    "psycopg[binary]>=3.1.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "consultorio_project.settings"
python_files = ["test_*.py"]
addopts = "-v --reuse-db"
