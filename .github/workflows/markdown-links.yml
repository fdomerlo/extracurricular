name: Markdown Links

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown-links:
    name: Check Markdown links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check local Markdown links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path('.')
          errors = []
          pattern = re.compile(r'\[[^\]]*\]\(([^)]+)\)')

          for md in root.rglob('*.md'):
              if any(part in {'.git', '.venv', '__pycache__'} for part in md.parts):
                  continue
              text = md.read_text(encoding='utf-8')
              for target in pattern.findall(text):
                  target = target.strip()
                  if not target or target.startswith(('http://', 'https://', 'mailto:', '#')):
                      continue
                  target = target.split('#', 1)[0]
                  if not target:
                      continue
                  candidate = (md.parent / target).resolve()
                  try:
                      candidate.relative_to(root.resolve())
                  except ValueError:
                      errors.append(f'{md}: link escapes repository: {target}')
                      continue
                  if not candidate.exists():
                      errors.append(f'{md}: missing local target: {target}')

          if errors:
              print('\n'.join(errors))
              sys.exit(1)

          print('Markdown local links: OK')
          PY
